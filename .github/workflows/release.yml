name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0.0"
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          {
            echo "tag=$TAG"
            echo "name=$VERSION"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Building $TAG (versionName=$VERSION, versionCode=$CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
          if [ -z "$SDKMGR" ]; then
            echo "cmdline-tools not present, downloading them."
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSLo /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "Using signing keystore from repository secrets."
          else
            echo "::warning::KEYSTORE_BASE64 is not set. Generating a throwaway keystore; the APK installs but cannot update a build signed with another key. Add the signing secrets for stable releases."
            KEYSTORE_PASSWORD="android"
            KEY_ALIAS="radiotune"
            KEY_PASSWORD="android"
            keytool -genkeypair -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=RadioTune,O=RadioTune,C=US" > /dev/null
          fi
          {
            echo "KEYSTORE_FILE=$KEYSTORE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Verify and stage APK
        id: apk
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/app-release.apk"
          DEST="RadioTune-${{ steps.version.outputs.name }}.apk"
          STABLE="RadioTune-latest.apk"
          cp "$SRC" "$DEST"
          cp "$SRC" "$STABLE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "$DEST" | head -3
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST" "$STABLE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RadioTune ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            RadioTune-${{ steps.version.outputs.name }}.apk
            RadioTune-latest.apk
          body: |
            RadioTune ${{ steps.version.outputs.name }}

            Signed release APK (minSdk 24).

            SHA-256: `${{ steps.apk.outputs.sha256 }}`
